<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Agents LLM en 60 minutes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : app plein écran. Accueil = liste de modules ; leçon = une carte par écran, barre de progression type « stories », bouton Continuer en bas, balayage horizontal */
:root{
  --bg:#F2F2F7; --tint1:rgba(0,122,255,.20); --tint2:rgba(175,82,222,.15); --tint3:rgba(52,199,89,.13);
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.30); --sep:rgba(60,60,67,.16);
  --fill:rgba(120,120,128,.12); --cell:rgba(255,255,255,.80);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --edge:rgba(255,255,255,.9); --shadow:rgba(0,0,0,.08);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --indigo:#5856D6; --pink:#FF2D55; --teal:#30B0C7; --purple:#AF52DE;
  --ok-soft:rgba(52,199,89,.14); --bad-soft:rgba(255,59,48,.12);
  --code-bg:#1C1C1E; --code-ink:#F2F2F7; --code-dim:#8E8E93; --code-str:#FC6A5D; --code-key:#FF7AB2;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --fm:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --tint1:rgba(10,132,255,.26); --tint2:rgba(191,90,242,.20); --tint3:rgba(48,209,88,.12);
  --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.28); --sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24); --cell:rgba(30,30,32,.75);
  --glass:rgba(38,38,42,.55); --glass-strong:rgba(44,44,48,.82); --edge:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.45);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --indigo:#5E5CE6; --pink:#FF375F; --teal:#40C8E0; --purple:#BF5AF2;
  --ok-soft:rgba(48,209,88,.18); --bad-soft:rgba(255,69,58,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --tint1:rgba(10,132,255,.26); --tint2:rgba(191,90,242,.20); --tint3:rgba(48,209,88,.12);
  --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.28); --sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24); --cell:rgba(30,30,32,.75);
  --glass:rgba(38,38,42,.55); --glass-strong:rgba(44,44,48,.82); --edge:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.45);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --indigo:#5E5CE6; --pink:#FF375F; --teal:#40C8E0; --purple:#BF5AF2;
  --ok-soft:rgba(48,209,88,.18); --bad-soft:rgba(255,69,58,.18); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--f);font-size:17px;line-height:1.45;letter-spacing:-.022em;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(60px)}
.aura i:nth-child(1){width:80vmax;height:80vmax;left:-35vmax;top:-35vmax;background:var(--tint1)}
.aura i:nth-child(2){width:65vmax;height:65vmax;right:-35vmax;top:25%;background:var(--tint2)}
.aura i:nth-child(3){width:60vmax;height:60vmax;left:-20vmax;bottom:-35vmax;background:var(--tint3)}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
code{font-family:var(--fm);font-size:.84em;background:var(--fill);padding:.06em .32em;border-radius:6px;letter-spacing:0}
h1,h2,h3{margin:0;font-family:var(--fd);text-wrap:balance}
p{margin:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:.5px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),0 8px 28px var(--shadow)}
.ic{display:inline-grid;place-items:center;color:#fff;font-weight:700;font-family:var(--fd);flex:none;letter-spacing:0;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0)),var(--c,var(--blue))}

.app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto}
.view{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- ACCUEIL ---------- */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 32px;gap:26px}
.hello{display:flex;flex-direction:column;gap:8px}
.hello small{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.hello h1{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hello p{font-size:17px;color:var(--label2)}
.resume{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;text-align:left;width:100%}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--fill)} .ring .pr{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.resume .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.resume .tx span{font-size:13px;color:var(--label2)}
.resume .tx b{font-size:19px;font-weight:700;letter-spacing:-.025em}
.resume .go{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.resume .go svg{width:18px;height:18px;fill:#fff;margin-left:3px}
.sec{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding-left:16px;margin-bottom:-18px}
.mods{border-radius:24px;overflow:hidden}
.mod{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;position:relative;min-height:72px}
.mod + .mod::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:.5px solid var(--sep)}
.mod:active{background:var(--fill)}
.mod .ic{width:38px;height:38px;border-radius:10px;font-size:17px}
.mod .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mod .tx b{font-size:17px;font-weight:600;line-height:1.2}
.mod .tx span{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.mbar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c);border-radius:2px}
.mod .chev{width:9px;height:9px;border-right:2px solid var(--label3);border-top:2px solid var(--label3);transform:rotate(45deg);flex:none;margin-right:4px}
.mod .done{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.foot{display:flex;justify-content:center}
.foot button{color:var(--label2);font-size:15px;padding:10px 14px;border-radius:12px}
.foot button.armed{color:var(--red);font-weight:600}

/* ---------- LEÇON ---------- */
.lbar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));flex:none}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.round svg{width:16px;height:16px;stroke:var(--label);stroke-width:2.4;fill:none;stroke-linecap:round}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--fill);overflow:hidden;position:relative}
.segs i::after{content:"";position:absolute;inset:0;background:var(--c,var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.segs i.on::after{transform:scaleX(1)}
.count{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.stage{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
.card{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px max(22px,env(safe-area-inset-right,0px)) 24px max(22px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:18px;transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .3s ease}
.card.in-r{transform:translateX(40px);opacity:0}
.card.in-l{transform:translateX(-40px);opacity:0}
.card.out-l{transform:translateX(-40px);opacity:0;pointer-events:none}
.card.out-r{transform:translateX(40px);opacity:0;pointer-events:none}
.kicker{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--c,var(--blue))}
.kicker .ic{width:22px;height:22px;border-radius:6px;font-size:11px}
.card h2{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.12}
.sub{font-size:16px;color:var(--label2);line-height:1.45}
.big-idea{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.2;font-family:var(--fd)}
.big-idea em{font-style:normal;color:var(--c,var(--blue))}

.rows{border-radius:20px;overflow:hidden}
.r{display:flex;gap:14px;padding:14px 16px;position:relative;align-items:flex-start}
.r + .r::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.r .n{width:28px;height:28px;border-radius:8px;font-size:13px;margin-top:1px}
.r .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.r .t b{font-size:17px;font-weight:600}
.r .t span{font-size:15px;color:var(--label2);line-height:1.4}
.warnbox .r .n{--c:var(--orange)}

.flow{display:flex;flex-direction:column;align-items:stretch}
.node{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.node b{font-size:16px;font-weight:600}
.node span{font-size:14px;color:var(--label2)}
.node.hl{background:var(--c);color:#fff;border:0;box-shadow:0 8px 22px var(--shadow)}
.node.hl span{color:rgba(255,255,255,.85)}
.arrow{height:26px;display:flex;align-items:center;gap:10px;padding-left:22px;font-size:12px;color:var(--label2)}
.arrow::before{content:"";width:2px;height:100%;background:var(--label3);border-radius:1px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}

pre{margin:0;background:var(--code-bg);color:var(--code-ink);font-family:var(--fm);font-size:12.5px;line-height:1.6;letter-spacing:0;
  padding:16px;border-radius:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;flex:none}
pre .c{color:var(--code-dim)} pre .s{color:var(--code-str)} pre .k{color:var(--code-key)}

/* quiz */
.qlabel{font-size:13px;font-weight:600;color:var(--indigo);display:flex;align-items:center;gap:8px}
.qlabel .ic{width:22px;height:22px;border-radius:6px;font-size:12px;--c:var(--indigo)}
.qq{font-size:24px;font-weight:700;letter-spacing:-.028em;line-height:1.22;font-family:var(--fd)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:16px;font-size:17px;line-height:1.3;min-height:56px;
  transition:transform .15s ease,background .2s}
.opt:active:not([disabled]){transform:scale(.98)}
.opt .mk{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--label3);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.opt.right{background:var(--ok-soft);box-shadow:none}
.opt.right .mk{background:var(--green);border-color:var(--green)}
.opt.wrong{background:var(--bad-soft);box-shadow:none}
.opt.wrong .mk{background:var(--red);border-color:var(--red)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default;color:var(--label)}
.fb{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;animation:rise .3s cubic-bezier(.2,.85,.25,1)}
.fb b{font-size:17px}
.fb.ok{background:var(--ok-soft)} .fb.ok b{color:var(--green)}
.fb.ko{background:var(--bad-soft)} .fb.ko b{color:var(--red)}
.fb span{font-size:15px;line-height:1.42}
@keyframes rise{from{transform:translateY(8px);opacity:0}}

/* labs */
.lab{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:120px}
.bub{max-width:88%;padding:9px 14px;border-radius:20px;font-size:16px;line-height:1.35;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.bub small{display:block;font-size:11px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.bub.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.m{align-self:flex-start;background:var(--fill);border-bottom-left-radius:6px}
.bub.s{align-self:center;text-align:center;border:1.5px dashed var(--label3);color:var(--label2);font-size:14px;border-radius:14px}
.bub pre{font-size:11px;padding:8px 10px;border-radius:10px;margin-top:6px}
.bub.u pre{background:rgba(0,0,0,.25)}
@keyframes pop{from{transform:scale(.9) translateY(6px);opacity:0}}
.pill-btn{align-self:flex-start;padding:10px 16px;border-radius:99px;background:var(--fill);color:var(--blue);font-weight:600;font-size:15px}
.rrf{display:flex;flex-direction:column;border-radius:16px;background:var(--cell);overflow:hidden}
.rrf .rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:12px 14px;position:relative}
.rrf .rw + .rw::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.rrf .nm{font-size:15px;font-weight:600;line-height:1.3}
.rrf .rk{font-weight:700;font-size:14px;padding:2px 10px;border-radius:99px;background:var(--fill);font-variant-numeric:tabular-nums;align-self:start}
.rrf .rk.first{background:var(--blue);color:#fff}
.rrf .ins{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label2)}
.rrf input{width:58px;font:inherit;font-size:16px;text-align:center;padding:6px;border-radius:9px;border:0;background:var(--fill);color:var(--label);font-variant-numeric:tabular-nums}
.rrf .sc{margin-left:auto;font-family:var(--fm);font-size:13px;color:var(--label);letter-spacing:0}
.lab label{display:flex;flex-direction:column;gap:4px;font-size:15px}
.lab label .lv{display:flex;justify-content:space-between;color:var(--label2)}
.lab label .lv b{color:var(--label);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 3px 8px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.22)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:14px;background:var(--cell);padding:12px 14px;display:flex;flex-direction:column}
.stat span{font-size:13px;color:var(--label2)}
.stat b{font-family:var(--fd);font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat b.acc{color:var(--c,var(--blue))}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:10px;background:var(--fill);gap:2px}
.segc button{border-radius:8px;padding:8px 4px;font-size:14px;font-weight:500;min-height:34px}
.segc button[aria-pressed="true"]{background:var(--glass-strong);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* fin de module */
.card.end{align-items:center;text-align:center;justify-content:center}
.medal{width:96px;height:96px;border-radius:28px;font-size:44px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
.card.end h2{font-size:32px}
.card.end .stats{width:100%;text-align:left}

.lfoot{flex:none;display:flex;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.cta{flex:1;min-height:56px;border-radius:18px;background:var(--c,var(--blue));color:#fff;font-size:17px;font-weight:600;transition:transform .12s ease,opacity .2s}
.cta:active:not(:disabled){transform:scale(.97)}
.cta:disabled{opacity:.35;cursor:default}
.back{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px;stroke:var(--label);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.back:disabled{opacity:.3}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
  <section class="view" id="home" aria-label="Accueil">
    <div class="hello">
      <small>Parcours · 60 min</small>
      <h1>Agents LLM</h1>
      <p>Une idée par écran. Balayez ou touchez Continuer.</p>
    </div>
    <button class="resume glass" id="resume" type="button">
      <div class="ring"><svg viewBox="0 0 64 64"><circle class="tr" cx="32" cy="32" r="27"/><circle class="pr" id="ringPr" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><b id="ringTxt">0%</b></div>
      <div class="tx"><span id="resumeSub">Commencer</span><b id="resumeTitle">Agents &amp; tool calling</b></div>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span>
    </button>
    <div class="sec">Modules</div>
    <div class="mods glass" id="mods"></div>
    <div class="foot"><button type="button" id="reset">Recommencer à zéro</button></div>
  </section>

  <section class="view" id="lesson" aria-label="Leçon" hidden>
    <div class="lbar">
      <button class="round glass" id="close" type="button" aria-label="Retour à l'accueil"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="segs" id="segs"></div>
      <span class="count" id="count"></span>
    </div>
    <div class="stage" id="stage"></div>
    <div class="lfoot">
      <button class="back glass" id="prev" type="button" aria-label="Carte précédente"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="cta" id="next" type="button">Continuer</button>
    </div>
  </section>
</div>

<script>
/* ================= CONTENU ================= */
const M=[
{id:"agents",t:"Agents & tool calling",c:"--blue",min:14,cards:[
 {k:"idea",h:"Un agent, c'est…",big:"un LLM qui appelle des <em>outils</em>, dans une <em>boucle</em>.",sub:"Le modèle ne fait qu'écrire du texte. Pour agir, il écrit une demande d'appel d'outil. Votre code fait le reste."},
 {k:"rows",h:"Le tool calling en 4 temps",num:true,rows:[
   ["Déclarer","Nom, description et JSON Schema des paramètres. Le modèle choisit en lisant la description."],
   ["Le modèle demande","Il renvoie un bloc tool_use et s'arrête avec stop_reason = \"tool_use\"."],

 {k:"code",h:"La boucle, en Python",lead:"Toute la mécanique tient en quelques lignes.",code:`for step in range(10):        # garde-fou
    resp = client.messages.create(
        model=MODEL, max_tokens=1024,
        tools=tools, messages=messages)
    messages.append({"role": "assistant",
                     "content": resp.content})
    if resp.stop_reason != "tool_use":
        break                 # réponse finale
    results = [{"type": "tool_result",
                "tool_use_id": b.id,
                "content": run_tool(b.name, b.input)}
               for b in resp.content
               if b.type == "tool_use"]
    messages.append({"role": "user",
                     "content": results})`},

/* ================= ÉTAT ================= */
const S={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st=S.get("ag60v2",{pos:{},done:{},ans:{}});
const save=()=>S.set("ag60v2",st);
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(code){return code.split("\n").map(l=>{
  const m=l.match(/^(.*?)((?:^|\s)(?:#|--)\s.*)$/);let body=esc(m?m[1]:l),com=m?esc(m[2]):"";
  body=body.replace(/"([^"]*)"/g,'<span class="s">"$1"</span>').replace(/\b(from|import|def|return|for|in|if|break|CREATE|TABLE|INDEX|ON|USING|SELECT|FROM|ORDER BY|LIMIT|EXTENSION)\b/g,'<span class="k">$1</span>');
  return body+(com?'<span class="c">'+com+'</span>':"")}).join("\n")}

/* ================= ACCUEIL ================= */
function modProgress(m){return st.done[m.id]?1:Math.min(1,(st.pos[m.id]||0)/m.cards.length)}
function renderHome(){
  const box=$("mods");box.innerHTML="";
  M.forEach((m,i)=>{
    const b=document.createElement("button");b.type="button";b.className="mod";b.style.setProperty("--c",`var(${m.c})`);
    const pr=modProgress(m);const nq=m.cards.filter(c=>c.k==="quiz").length;
    b.innerHTML=`<span class="ic">${i<6?i+1:"✓"}</span><span class="tx"><b>${m.t}</b><span>${m.cards.length} cartes · ${m.min} min${nq?` · ${nq} quiz`:""}</span>${pr>0&&!st.done[m.id]?`<span class="mbar"><i style="width:${pr*100}%"></i></span>`:""}</span>${st.done[m.id]?'<span class="done">✓</span>':'<span class="chev"></span>'}`;
    b.addEventListener("click",()=>openModule(i));box.appendChild(b);
  });
  const core=M.slice(0,6);const total=core.reduce((s,m)=>s+m.cards.length,0);
  const seen=core.reduce((s,m)=>s+(st.done[m.id]?m.cards.length:Math.min(st.pos[m.id]||0,m.cards.length)),0);
  const pct=Math.round(100*seen/total);
  $("ringTxt").textContent=pct+"%";$("ringPr").style.strokeDashoffset=169.6*(1-pct/100);
  const ni=core.findIndex(m=>!st.done[m.id]);const target=ni<0?6:ni;const m=M[target];
  $("resumeTitle").textContent=m.t;
  $("resumeSub").textContent=ni<0?"Tout est terminé · réviser":(st.pos[m.id]?`Reprendre · carte ${st.pos[m.id]+1}/${m.cards.length}`:(seen?"Module suivant":"Commencer"));
  $("resume").onclick=()=>openModule(target);
}
let armed=false,armT=null;
function disarm(){armed=false;$("reset").classList.remove("armed");$("reset").textContent="Recommencer à zéro"}
$("reset").addEventListener("click",()=>{
  if(!armed){armed=true;$("reset").classList.add("armed");$("reset").textContent="Touchez encore pour tout effacer";armT=setTimeout(disarm,3000);return}
  clearTimeout(armT);st={pos:{},done:{},ans:{}};save();disarm();renderHome();
});

/* ================= LEÇON ================= */
let cur=0,idx=0,el=null;
function openModule(i){
  cur=i;const m=M[i];idx=st.done[m.id]?0:Math.min(st.pos[m.id]||0,m.cards.length-1);
  document.documentElement.style.setProperty("--c",`var(${m.c})`);
  $("home").hidden=true;$("lesson").hidden=false;
  const segs=$("segs");segs.innerHTML="";for(let k=0;k<m.cards.length;k++)segs.appendChild(document.createElement("i"));
  $("stage").innerHTML="";el=null;show(0);
}
function closeModule(){$("lesson").hidden=true;$("home").hidden=false;document.documentElement.style.removeProperty("--c");renderHome()}
$("close").addEventListener("click",closeModule);

function show(dir){
  const m=M[cur];const isEnd=idx>=m.cards.length;
  const card=isEnd?buildEnd(m):buildCard(m.cards[idx],m,idx);
  card.classList.add("card");if(dir)card.classList.add(dir<0?"in-l":"in-r");
  $("stage").appendChild(card);
  if(el){const old=el;old.classList.add(dir<0?"out-r":"out-l");setTimeout(()=>old.remove(),400)}
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove("in-l","in-r")));
  el=card;
  [...$("segs").children].forEach((s,k)=>s.classList.toggle("on",k<=idx));
  $("count").textContent=isEnd?"✓":`${idx+1}/${m.cards.length}`;
  if(!isEnd&&!st.done[m.id]){st.pos[m.id]=Math.max(st.pos[m.id]||0,idx);save()}
  $("prev").disabled=idx===0;
  updateNext();
}
function updateNext(){
  const m=M[cur];const n=$("next");
  if(idx>=m.cards.length){n.disabled=false;n.textContent=cur<M.length-1?"Module suivant":"Retour à l'accueil";return}
  const c=m.cards[idx];
  if(c.k==="quiz"&&st.ans[m.id+":"+idx]===undefined){n.disabled=true;n.textContent="Choisissez une réponse";return}
  n.disabled=false;n.textContent=idx===m.cards.length-1?"Terminer le module":"Continuer";
}
function go(d){
  const m=M[cur];
  if(d>0){
    if($("next").disabled)return;
    if(idx>=m.cards.length){if(cur<M.length-1)openModule(cur+1);else closeModule();return}
    idx++;if(idx>=m.cards.length){st.done[m.id]=true;st.pos[m.id]=0;save()}
  }else{if(idx===0)return;idx--}
  show(d);
}
$("next").addEventListener("click",()=>go(1));
$("prev").addEventListener("click",()=>go(-1));
document.addEventListener("keydown",e=>{if($("lesson").hidden)return;if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape")closeModule()});
/* balayage */
let sx=0,sy=0,tracking=false;
$("stage").addEventListener("touchstart",e=>{if(e.target.closest("input,pre,.rrf"))return;tracking=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",e=>{if(!tracking)return;tracking=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)go(dx<0?1:-1)},{passive:true});

/* ================= CARTES ================= */
function kicker(m){const mi=M.indexOf(m);return `<div class="kicker"><span class="ic">${mi<6?mi+1:"✓"}</span>${esc(m.t)}</div>`}
function rowsHTML(rows,num,warn){return `<div class="rows glass ${warn?"warnbox":""}">${rows.map((r,i)=>`<div class="r">${num?`<span class="ic n">${i+1}</span>`:warn?`<span class="ic n">!</span>`:""}<span class="t"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></span></div>`).join("")}</div>`}
function buildCard(c,m,i){
  const d=document.createElement("article");let h=kicker(m);
  if(c.k==="idea"){h+=`<h2>${c.h}</h2><p class="big-idea">${c.big}</p>${c.sub?`<p class="sub">${esc(c.sub)}</p>`:""}`}
  else if(c.k==="rows"){h+=`<h2>${c.h}</h2>${rowsHTML(c.rows,c.num)}`}
  else if(c.k==="warn"){h+=`<h2>${c.h}</h2>${rowsHTML(c.rows,false,true)}`}
  else if(c.k==="code"){h+=`<h2>${c.h}</h2>${c.lead?`<p class="sub">${esc(c.lead)}</p>`:""}<pre>${hl(c.code)}</pre>`}
  else if(c.k==="flow"){h+=`<h2>${c.h}</h2><div class="flow">${c.flow.map(f=>{
      if(f[0]==="a")return `<div class="arrow">${f[1]}</div>`;
      if(f[0]==="duo")return `<div class="duo">${[f[1],f[2]].map(x=>`<div class="node glass"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`;
      return `<div class="node ${f[0]==="hl"?"hl":"glass"}"><b>${f[1]}</b><span>${f[2]}</span></div>`}).join("")}</div>`}
  else if(c.k==="quiz"){d.innerHTML=h;buildQuiz(d,c,m,i);return d}
  else{h+=`<h2>${c.h}</h2>${c.lead?`<p class="sub">${esc(c.lead)}</p>`:""}`;d.innerHTML=h;({sim:buildSim,rrf:buildRRF,lora:buildLora,vram:buildVram})[c.k](d);return d}
  d.innerHTML=h;return d;
}
function buildQuiz(d,c,m,i){
  const key=m.id+":"+i;
  d.insertAdjacentHTML("beforeend",`<div class="qlabel"><span class="ic">?</span>Question</div><p class="qq">${esc(c.q)}</p>`);
  const opts=document.createElement("div");opts.className="opts";d.appendChild(opts);
  const btns=c.o.map((o,j)=>{const b=document.createElement("button");b.type="button";b.className="opt glass";b.innerHTML=`<span class="mk"></span><span>${esc(o)}</span>`;
    b.addEventListener("click",()=>{if(st.ans[key]!==undefined)return;st.ans[key]=j;save();paint(true);updateNext()});opts.appendChild(b);return b});
  function paint(fresh){const a=st.ans[key];if(a===undefined)return;
    btns.forEach((b,j)=>{b.disabled=true;const mk=b.firstChild;if(j===c.a){b.classList.add("right");mk.textContent="✓"}else if(j===a){b.classList.add("wrong");mk.textContent="✕"}else b.classList.add("dim")});
    const ok=a===c.a;const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"ko");fb.innerHTML=`<b>${ok?"Bonne réponse":"Pas tout à fait"}</b><span>${esc(c.w)}</span>`;d.appendChild(fb);
    if(fresh&&navigator.vibrate)try{navigator.vibrate(ok?15:[20,40,20])}catch(e){}
    if(fresh)setTimeout(()=>fb.scrollIntoView({behavior:"smooth",block:"nearest"}),50)}
  paint(false);
}
function buildEnd(m){
  const d=document.createElement("article");d.classList.add("end");
  const qs=m.cards.map((c,i)=>[c,i]).filter(([c])=>c.k==="quiz");
  const ok=qs.filter(([c,i])=>st.ans[m.id+":"+i]===c.a).length;
  const next=M[M.indexOf(m)+1];
  d.innerHTML=`<span class="ic medal">✓</span><h2>${esc(m.t)}<br>terminé</h2>
   <div class="stats">${qs.length?`<div class="stat"><span>Quiz réussis</span><b class="acc">${ok}/${qs.length}</b></div>`:""}<div class="stat"><span>Cartes vues</span><b>${m.cards.length}</b></div></div>
   <p class="sub">${next?`À suivre : ${esc(next.t)}.`:"Vous avez fait le tour. Revenez à la révision express quand vous voulez."}</p>`;
  return d;
}
/* ateliers */
function buildSim(d){
  const steps=[["u","Utilisateur","Je prends un parapluie à Lyon ?"],
   ["m","Modèle · tool_use","Je vérifie la météo.",'{"name": "get_weather",\n "input": {"city": "Lyon"}}'],
   ["s","Votre code","Exécute get_weather(\"Lyon\") → 14 °C, 3 mm de pluie"],
   ["u","tool_result","Le résultat repart au modèle.",'{"tool_use_id": "toolu_01",\n "content": "14 °C, 3 mm"}'],
   ["m","Modèle · end_turn","Oui, prenez-le : 3 mm de pluie prévus."],
   ["s","Fin","Plus de demande d'outil : la boucle s'arrête."]];
  const lab=document.createElement("div");lab.className="lab glass";const chat=document.createElement("div");chat.className="chat";
  const btn=document.createElement("button");btn.type="button";btn.className="pill-btn";let k=0;
  function add(){const s=steps[k++];const b=document.createElement("div");b.className="bub "+s[0];b.innerHTML=`<small>${esc(s[1])}</small>${esc(s[2])}`;if(s[3]){const p=document.createElement("pre");p.textContent=s[3];b.appendChild(p)}chat.appendChild(b);
    btn.textContent=k<steps.length?"Étape suivante":"Rejouer";if(k>1)setTimeout(()=>b.scrollIntoView({behavior:"smooth",block:"nearest"}),30)}
  btn.addEventListener("click",()=>{if(k>=steps.length){chat.innerHTML="";k=0}add()});
  lab.append(chat,btn);d.appendChild(lab);add();
}
function buildRRF(d){
  const docs=[["Guide de dépannage",1,4],["Erreur E-4012 : bourrage",9,1],["FAQ garantie",2,7],["Installer le pilote",3,3]];
  const lab=document.createElement("div");lab.className="lab glass";
  lab.innerHTML=`<div class="rrf">${docs.map((x,i)=>`<div class="rw"><span class="nm">${x[0]}</span><span class="rk" data-r="${i}"></span><div class="ins">Dense <input type="number" inputmode="numeric" min="1" max="50" value="${x[1]}" data-d="${i}" aria-label="Rang dense"> BM25 <input type="number" inputmode="numeric" min="1" max="50" value="${x[2]}" data-b="${i}" aria-label="Rang BM25"><span class="sc" data-s="${i}"></span></div></div>`).join("")}</div>
   <label><span class="lv">k <b data-k>60</b></span><input type="range" min="1" max="100" value="60" aria-label="Constante k"></label>`;
  d.appendChild(lab);
  const q=s=>lab.querySelector(s);
  function calc(){const k=+q("input[type=range]").value;q("[data-k]").textContent=k;
    const sc=docs.map((_,i)=>{let s=0;const a=parseInt(q(`[data-d="${i}"]`).value),b=parseInt(q(`[data-b="${i}"]`).value);if(a>0)s+=1/(k+a);if(b>0)s+=1/(k+b);return s});
    const ord=[...sc.keys()].sort((x,y)=>sc[y]-sc[x]);
    sc.forEach((s,i)=>{q(`[data-s="${i}"]`).textContent=s.toFixed(4);const r=ord.indexOf(i)+1;const e=q(`[data-r="${i}"]`);e.textContent="#"+r;e.classList.toggle("first",r===1)})}
  lab.addEventListener("input",calc);calc();
  d.insertAdjacentHTML("beforeend",`<p class="sub">« Erreur E-4012 » est 9e en dense mais 1er en BM25 : la fusion le fait remonter.</p>`);
}
const nf=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:1});
const human=n=>n>=1e6?nf.format(n/1e6)+" M":n>=1e3?nf.format(n/1e3)+" k":String(n);
function buildLora(d){
  const lab=document.createElement("div");lab.className="lab glass";
  lab.innerHTML=`<label><span class="lv">Dimension d <b data-o="d">4096</b></span><input type="range" data-i="d" min="1024" max="8192" step="512" value="4096"></label>
   <label><span class="lv">Rang r <b data-o="r">16</b></span><input type="range" data-i="r" min="1" max="128" value="16"></label>
   <div class="stats"><div class="stat"><span>Complet</span><b data-o="f"></b></div><div class="stat"><span>LoRA</span><b class="acc" data-o="l"></b></div></div>
   <p class="sub" data-o="p" style="text-align:center"></p>`;
  d.appendChild(lab);const o=k=>lab.querySelector(`[data-o="${k}"]`);
  function calc(){const dd=+lab.querySelector('[data-i="d"]').value,r=+lab.querySelector('[data-i="r"]').value;o("d").textContent=dd;o("r").textContent=r;
    const f=dd*dd,l=2*r*dd;o("f").textContent=human(f);o("l").textContent=human(l);o("p").textContent=`soit ${new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(100*l/f)} % des paramètres`}
  lab.addEventListener("input",calc);calc();
}
function buildVram(d){
  const lab=document.createElement("div");lab.className="lab glass";
  lab.innerHTML=`<label><span class="lv">Paramètres <b data-o="p">8 Md</b></span><input type="range" min="1" max="120" value="8" aria-label="Milliards de paramètres"></label>
   <div class="segc" role="group" aria-label="Précision"><button type="button" data-b="2" aria-pressed="true">BF16</button><button type="button" data-b="1" aria-pressed="false">FP8</button><button type="button" data-b="0.5" aria-pressed="false">INT4</button></div>
   <div class="stats"><div class="stat"><span>Poids</span><b class="acc" data-o="w"></b></div><div class="stat"><span>Avec KV cache</span><b data-o="t"></b></div></div>`;
  d.appendChild(lab);let by=2;const o=k=>lab.querySelector(`[data-o="${k}"]`);
  function calc(){const p=+lab.querySelector("input").value;o("p").textContent=p+" Md";o("w").textContent=nf.format(p*by)+" Go";o("t").textContent="~"+nf.format(Math.round(p*by*1.3))+" Go"}
  lab.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>{by=+b.dataset.b;lab.querySelectorAll("[data-b]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));calc()}));
  lab.addEventListener("input",calc);calc();
}

renderHome();
</script>
